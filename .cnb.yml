#WorkFlow
master:
  push:
    - docker:
        image: maven:3.9.6-amazoncorretto-21
      stages:
        - name: mvn package
          script:
            mvn clean deploy -s ./settings.xml

# 发布触发器配置
"**":
  web_trigger:
    - docker:
        image: maven:3.9.6-amazoncorretto-21
      stages:
        - name: 环境变量输出
          script: |
            echo "项目名称: ${PROJECT_NAME}"
            
            # 从pom.xml自动获取版本号
            CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            echo "自动从pom.xml获取版本号: ${CURRENT_VERSION}"
            
            echo "版本号: ${CURRENT_VERSION}"
            echo "发布类型: ${RELEASE_TYPE}"
            echo "构建分支: ${BUILD_BRANCH}"
            echo "发布内容:"
            echo "${RELEASE_CONTENT}"
            
            # 导出版本号到环境变量
            echo "VERSION=${CURRENT_VERSION}" >> $CNB_ENV
          exports:
            VERSION: CURRENT_VERSION
        - name: 构建项目
          script: |
            # 安装git
            echo "安装git..."
            yum update -y && yum install -y git
            
            # 切换到指定分支
            echo "切换到分支: ${BUILD_BRANCH}"
            git checkout ${BUILD_BRANCH}
            git pull origin ${BUILD_BRANCH}
            
            # 构建项目
            mvn clean install -s ./settings.xml
        - name: 创建发布
          type: git:release
          options:
            tag: "v${VERSION}"
            title: "Easy4Form"
            description: "${RELEASE_CONTENT}"
            preRelease: false
            latest: true
        - name: 上传JAR文件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: "v${VERSION}"
            attachments:
              - "target/easy4form-*.jar"
              - "!target/*-shaded.jar"
          exports:
            FILES: FILES
  web_trigger_preview:
