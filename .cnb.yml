#WorkFlow
master:
  push:
    - docker:
        image: maven:3.9.6-amazoncorretto-21
      stages:
        - name: mvn package
          script:
            mvn clean deploy -s ./settings.xml

# 发布触发器配置
"**":
  release_trigger:
    - docker:
        image: maven:3.9.6-amazoncorretto-21
      stages:
        - name: 环境变量输出
          script: |
            echo "项目名称: ${PROJECT_NAME}"
            
            # 如果版本号为空，则从pom.xml自动获取
            if [ -z "${VERSION}" ]; then
              CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
              echo "自动从pom.xml获取版本号: ${CURRENT_VERSION}"
              export VERSION=${CURRENT_VERSION}
            else
              echo "用户指定版本号: ${VERSION}"
            fi
            
            echo "版本号: ${VERSION}"
            echo "发布类型: ${RELEASE_TYPE}"
            echo "构建分支: ${BUILD_BRANCH}"
            echo "发布内容:"
            echo "${RELEASE_CONTENT}"
        - name: 构建项目
          script: |
            # 切换到指定分支
            echo "切换到分支: ${BUILD_BRANCH}"
            git checkout ${BUILD_BRANCH}
            git pull origin ${BUILD_BRANCH}
            
            # 如果版本号与当前不同，则更新pom.xml版本
            CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            if [ "${CURRENT_VERSION}" != "${VERSION}" ]; then
              echo "更新项目版本从 ${CURRENT_VERSION} 到 ${VERSION}"
              mvn versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
            fi
            
            # 构建项目
            mvn clean deploy -s ./settings.xml
        - name: 创建发布
          script: |
            echo "正在创建 ${RELEASE_TYPE} 版本 ${VERSION}"
            echo "发布标题: Easy4Form ${VERSION}"
            echo "发布内容:"
            echo "${RELEASE_CONTENT}"
            
            # 提交版本变更（如果有）
            if git status --porcelain | grep -q "pom.xml"; then
              echo "提交版本变更"
              git add pom.xml
              git commit -m "更新版本到 ${VERSION}"
              git push origin ${BUILD_BRANCH}
            fi
            
            # 创建Git标签
            TAG_NAME="v${VERSION}"
            if [ "${RELEASE_TYPE}" = "preview" ]; then
              TAG_NAME="v${VERSION}-preview"
              echo "创建预览版标签: ${TAG_NAME}"
            else
              echo "创建正式版标签: ${TAG_NAME}"
            fi
            
            git tag -a "${TAG_NAME}" -m "${RELEASE_CONTENT}"
            git push origin "${TAG_NAME}"
            
            echo "发布流程完成 - 标签 ${TAG_NAME} 已创建并推送到远程仓库"