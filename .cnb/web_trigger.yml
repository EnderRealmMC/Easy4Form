branch:
  # 发布触发器 - 在所有分支显示
  - buttons:
      - name: 发布版本
        description: Easy4Form ${VERSION}
        event: release_trigger
        env:
          # 默认环境变量
          PROJECT_NAME: Easy4Form
        inputs:
          # 版本号输入框
          VERSION:
            name: 版本号
            description: 请输入版本号（如：1.0.0），将自动从pom.xml获取当前版本作为默认值
            required: true
            type: input
            default: ""
          # 发布内容多行编辑器
          RELEASE_CONTENT:
            name: 发布内容
            description: 请输入发布说明和更新内容
            required: true
            type: textarea
            default: |
              ## 新特性
              - 新增功能
              - 优化体验
              
              ## 修复
              - 修复已知问题
          # 发布类型选择
          RELEASE_TYPE:
            name: 发布类型
            description: 选择发布类型
            required: true
            type: select
            default: official
            options:
              - name: 正式版
                value: official
                description: 正式发布版本
              - name: 预览版
                value: preview
                description: 预览测试版本
          # 构建分支选择
          BUILD_BRANCH:
            name: 构建分支
            description: 选择要构建的分支
            required: true
            type: input
            default: master